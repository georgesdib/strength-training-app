# Thresholds that change or check a prescribed load.
#
# AGENTS.md §4: rep ranges, load increments and caps are CONFIG, not code. Changing a value
# here changes what the athlete is told to lift, so every entry carries its domain reason.
# Anything that alters a prescribed load and is not written down here is a bug.
#
# One block is advisory and cannot alter anything: `plausibility` only decides when to say
# something out loud. It lives here because it is a threshold on the load base and belongs
# next to the e1RM window it measures against.

schema_version: "1.0.0"

load:
  # The athlete owns 0.25 kg microplates, so the smallest real jump is 0.25 kg per side =
  # 0.5 kg on the bar. Prescribing 2.5 kg steps would leave most of that resolution unused.
  increment_kg: 0.5
  # Per-lift overrides, e.g. a machine with fixed 5 kg pins. Empty: every lift uses 0.5 kg.
  per_exercise_increment_kg: {}

  # Always round DOWN. A prescribed load the athlete cannot actually make is not executable,
  # and rounding up would silently exceed the target RIR.
  rounding: down

  # How far back a usable set can be. A recent best-in-window reflects current form; an
  # all-time best from two years ago would prescribe loads the athlete cannot currently hit.
  e1rm_window_days: 84

  # Which e1RM to build the load from (DEC-E1RM-SOURCE-01).
  #   best_usable — the highest age-decayed estimate in the window. The maximum of noisy
  #                 observations is biased upward by construction: one great day sets the
  #                 load for as long as it stays in the window.
  #   median      — the median set-level estimate in the shorter robust window, falling back
  #                 to best_usable when that window is empty. A typical set is a less exciting
  #                 estimator and a more honest one; it is the default.
  #   most_recent — the latest usable set only. Least biased by history, most exposed to a
  #                 single bad day.
  e1rm_source: median
  # The robust window for `median`. Four weeks is about one mesocycle of comparable effort:
  # long enough to average out a single outlier, short enough to track current form. It must
  # not exceed e1rm_window_days, or the estimator could see sets the window excludes.
  e1rm_robust_window_days: 28

# Advisory only: this block never changes a load, a set or a verdict (DEC-E1RM-PLAUS-01).
#
# The check answers one question: is the number behind this load plausible against what the
# athlete has actually been lifting? It catches a *single-point* error in the load base — a
# measured override far above history, a best-of-window estimate after a config flip, a median
# that had to fall back to the older window. It cannot catch a *systematic* bias in the whole
# e1RM distribution; that is MOD-E1RM-001's job, measured against real tests.
plausibility:            # ASSUMPTION-37: the window, sample and 5% bound are design choices
  enabled: true
  # Compared against the median working-set e1RM on the same lift over this window. 28 days
  # matches the default selector, so under `median` with ordinary history the check is silent
  # by construction — it only speaks when the load base came from somewhere else.
  reference_days: 28
  # Fewer reference sets than this is noise, so nothing is reported. Three is the smallest
  # sample whose median is not simply the most recent set.
  min_sets: 3
  # A load base more than this fraction above the recent median is worth saying out loud.
  # 5% is roughly one rep at RIR 2 on a five-rep set — inside the RIR reporting error — so the
  # threshold sits where the estimate stops being explainable by ordinary set-to-set noise.
  max_above_reference: 0.05

modifiers:
  # MOD-FAT-001 allows reducing load 5-10%. Take the smaller intervention first: a 5% cut is
  # already enough to matter, and the session can still be completed as written.
  fatigue_load_multiplier: 0.95

  # MOD-BACK-001: when the back flares, erector work returns to the weeks 1-3 dose (bodyweight,
  # three sets) and main lifts are held at RIR 3-4 for a week. The constitution's own wording,
  # parameterised here so the numbers are not buried in code.
  back_flare_erector_sets: 3
  back_flare_erector_added_kg: 0
  back_flare_main_rir: 3

prescription:
  # Default session-time target. The athlete profile may raise or lower it; this is a planning
  # target, not a hard ceiling. Recorded because the prescription row stores a time target even
  # when it cannot be measured (no timestamps in the export).
  session_time_cap_s: 4800
  # A proposal may change set counts but never loads, RIR or the exercise taxonomy. These bounds
  # are the whole of its licence: anything outside them is rejected, not clamped.
  proposal_max_set_change: 2
  proposal_max_sets: 8
  # Replacing an essential lift is a programme change, not a convenience. At most one per
  # proposal, only for a rated primary compound, and no more often than this.
  proposal_main_substitution_min_interval_days: 42

continuity:
  # Detraining evidence: two weeks of cessation already reduces fast/eccentric strength, and
  # eight weeks reduces strength further (REFERENCES §6). These cut-points are adapted, not
  # measured; ASSUMPTION-07.
  short_gap_days: 14
  medium_gap_days: 28
  long_gap_days: 56
  medium_load_multiplier: 0.95
  long_load_multiplier: 0.90
  rir_bump: 1

testing:
  # A test is an assessment, not a training session. Testing more often than monthly turns a
  # measurement into a stimulus with fatigue attached (see docs/TRAINING-DYNAMICS.md).
  min_interval_days: 28
  # True 1RM is allowed but rare, and always confirmed: 8 weeks between maximal singles.
  max_single_min_interval_days: 56
