# Periodic measurement metrics — outcomes, not daily readiness.
#
# Readiness (sleep, energy, HRV, RHR, grip as a daily field) feeds the fatigue modifier.
# These metrics are *assessments*: VO2max estimates, grip, function tests, steps, sitting time.
# They never change a load. Each metric is declared once in `metric_definition` (direction and
# aggregation are mandatory) and then measured as often as the athlete repeats the test.
#
# `higher_is_better` is explicit because the opposite is a real trap: a 5x sit-to-stand time is
# better when *lower*, steps are better when higher.
#
# Precedence: this file > nothing. A metric key not listed here is rejected rather than
# assumed to be higher-is-better (DATA-MODEL §11.4).

schema_version: "1.0.0"

metrics:

  vo2max:
    label: "VO2max estimate"
    unit: "ml/kg/min"
    higher_is_better: true
    aggregation: last
    plausible: [10, 90]
    note: >
      Submaximal estimate (step test, 1.5-mile/2 km, or device). Record the method; never
      compare estimates from different protocols as if they were the same measurement.

  # Two keys, one per hand: grip is a per-hand capacity, and a single key forced the hand into
  # the free-text method where it could not be compared or filtered (DEC-GRIP-02). Grip is not a
  # readiness input (DEC-GRIP-01); these are periodic assessments.
  grip_strength_right_kg:
    label: "Grip strength (right)"
    unit: "kg"
    higher_is_better: true
    aggregation: best_of_3
    plausible: [5, 150]
    note: "Best of three squeezes with the right hand; record the dynamometer in the method."

  grip_strength_left_kg:
    label: "Grip strength (left)"
    unit: "kg"
    higher_is_better: true
    aggregation: best_of_3
    plausible: [5, 150]
    note: "Best of three squeezes with the left hand; record the dynamometer in the method."

  body_fat_pct:
    label: "Body fat"
    unit: "%"
    # Display convention only: lower is treated as the better direction because the number is
    # tracked, not because very low body fat is a target. The catalogue is boolean, so the
    # note carries the "U-shaped, no optimum" caveat.
    higher_is_better: false
    aggregation: last
    plausible: [3, 70]
    note: >
      Measured by DEXA, callipers or a scale; record the method, because protocols are not
      comparable. Lower-is-better is a display convention, not a health optimum.

  sit_to_stand_5_s:
    label: "5x sit-to-stand"
    unit: "s"
    higher_is_better: false
    aggregation: last
    plausible: [3, 120]
    note: "Time to stand five times from a chair without arms; lower is better."

  steps_per_day:
    label: "Steps per day"
    unit: "steps"
    higher_is_better: true
    aggregation: mean
    plausible: [0, 60000]
    note: "Weekly or monthly average from a phone or watch."

  sitting_hours_per_day:
    label: "Sitting time"
    unit: "h"
    higher_is_better: false
    aggregation: mean
    plausible: [0, 24]
    note: "Average daily sitting; lower is better, but it is context, not a prescription."

# Rows written before a metric was split are read under the metric that now owns them. The log is
# append-only, so the stored row is never rewritten; the alias maps the old key at read time
# (DEC-GRIP-02). An alias may not also be a configured metric, and its target must exist here.
legacy_aliases:
  grip_strength_kg: grip_strength_right_kg
