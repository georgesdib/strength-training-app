# Periodic review reminders. These are prompts, not automatic programme changes.
schema_version: "1.0.0"
schema_version: 1.0.0
readiness_thresholds:
  label: Review readiness thresholds
  interval_weeks: 12
  interval_sessions: 40
  snooze_days: 14
  doc: docs/READINESS-EXERCISE-SELECTION-PLAN.md
  why: 'Readiness associations and the absolute/relative gates are policy choices.
    Review them against held-out data; do not change a threshold because one week
    looked unusual.

    '
  steps:
  - Re-run the readiness-performance and readiness-sRPE associations.
  - Compare the current absolute threshold with the absolute-plus-relative gate.
  - Check how many sessions would trigger each rule.
  - Keep the current threshold unless the alternative wins out of sample.
  dont:
  - Do not change thresholds automatically.
  - Do not choose and validate a cutoff on the same data.
strength_test:
  label: 3RM/5RM strength test
  every_weeks: 10
  doc: docs/TRAINING-DYNAMICS.md
  why: A periodic submaximal test keeps e1RM honest without routine 1RM testing.
  steps:
  - Run `strength-coach test --status`.
  - Schedule the indicated 3RM or 5RM when due.
srpe_coverage:
  label: sRPE/duration coverage
  window_days: 56
  target_pct: 80
  minimum_sessions: 6
  doc: docs/archive/NEXT-PHASE-FATIGUE-PLAN.md
  why: Missing sRPE/duration weakens every descriptive calibration and the dashboard.
  steps:
  - Review recent sessions with missing sRPE or duration.
  - Fill what you remember; leave the rest blank.
readiness_baseline:
  label: Readiness baseline sufficiency
  window_days: 28
  minimum_readings: 10
  doc: docs/READINESS-EXERCISE-SELECTION-PLAN.md
  why: The relative gate needs enough prior readings; otherwise it falls back to the
    fixed value.
  steps:
  - Keep logging the required readiness fields.
  - If the baseline is insufficient, use the fixed fallback and record it.
back_pattern:
  label: Back-pattern review
  recent_days: 14
  doc: docs/SYMPTOM-LOGGING.md
  why: A new episode may not fit the three known tweaks; review without changing rules
    automatically.
  steps:
  - Check whether the new episode fits the existing case series.
  - If not, record what was different.
  - Do not change the back rules automatically.
exercise_substitution:
  label: Review substitution suggestions
  interval_weeks: 8
  interval_sessions: 30
  snooze_days: 14
  doc: docs/READINESS-EXERCISE-SELECTION-PLAN.md
  why: The suggestion-only slice needs real usage before automatic withholding is
    considered; check acceptance, friction, symptoms and session completion.
  steps:
  - Review how often symptom and stress/readiness suggestions appeared.
  - Check whether suggestions were accepted, ignored or blocked.
  - Check back symptoms, session completion and main-lift performance.
  - Decide whether to keep suggestions-only, adjust tax values, or revisit automatic
    withholding.
  dont:
  - Do not enable automatic withholding from this review alone.
  - Do not change tax values without recording the reason.
fatigue_signals:
  label: Fatigue-signal review
  interval_weeks: 8
  interval_sessions: 24
  snooze_days: 14
  doc: docs/FATIGUE-SIGNALS.md
  why: 'The exposure ratio, demand ratings and shadow decisions are descriptive evidence.
    Review them on a cadence so the data stays honest; this reminder never enables a
    behaviour.

    '
  steps:
  - Rate any reachable exercise still missing an in-scope dimension (Exercises -> Details ->
    Demand profile; 'exercise demands unrated' lists them).
  - 'Read the Prescribe Exposure ratio panel: signal, coverage and abstentions, not just the
    number.'
  - Open Shadow review and check how often the signal fired, what it would have trimmed or
    suggested, and which gate checks pass.
  - Record a decision here, even when it is kept or insufficient.
  dont:
  - Do not enable the exposure trim because one week's ratio is high.
  - Do not treat the ratio as an injury-risk rule (LIM-56).
  - Do not edit the reviewed demand file; the local overlay is for your own ratings.

injury_attribution_phase3:
  label: Phase 3 — Exercise-level symptom research
  status: planned
  doc: docs/INJURY-ATTRIBUTION-PLAN.md
  summary: Unscheduled research follow-up; Phase 1–2 are closed.
  why: >
    A descriptive exercise-level symptom analysis is a separate research question, not
    unfinished attribution work. It must not become a predictor, a suitability rule or a
    prescription change without a pre-registered screen and a separate decision.
  steps:
  - Wait for enough prospective symptom and exposure data to make a descriptive screen meaningful.
  - Pre-register the question, outcome window, confounders and analysis before looking at results.
  - Report exposure and symptom counts with missingness and uncertainty; classify the result as descriptive only.
  - Record a separate decision before any product behaviour is considered.
  dont:
  - Do not use athlete attribution as the label source; it is a suspicion, not a cause.
  - Do not create a risk score, predictor or automatic selection/load change.
  - Do not start this analysis as a reason to reopen Phase 1 or Phase 2.

phase5a_review:
  label: Phase 5A — Prospective validation review
  start_date: "2026-10-30"
  due_date: "2027-01-22"
  snooze_days: 14
  doc: docs/MONITORING-ANALYSIS.md
  why: >
    The 12-week prospective observation window must be reviewed before any monitoring
    improvement is approved. This is a review gate, not an automatic change.
  steps:
  - Review data quality, completeness, missingness and provenance across the observation window.
  - Assess measurement reliability, metric distributions, variability and responsiveness.
  - Review the existing calibration evidence and current-as-of factor/CI transparency.
  - Compare monitoring changes with training performance and exposure without claiming causality.
  - Classify every metric as supported, provisionally supported, insufficient evidence,
    not validated or not applicable, and record the rationale.
  - Decide whether to proceed to Phase 5B, extend Phase 5A once by about four weeks, or close Phase 5A without Phase 5B.
  dont:
  - Do not change monitoring parameters, calibration, thresholds or prescriptions during Phase 5A.
  - Do not treat an observed correlation as causal or as a validated predictor.
  - Do not begin Phase 5B before an explicit review decision.

# AFC follow-ups. These are visible reminders, not programme changes; the phase-5A gate does
# not start any of them. DEC-AFC-09.
afc_device_acceptance:
  label: AFC-2i report — physical iPhone acceptance
  status: attention
  doc: docs/AFC.md
  why: >
    The session report and its per-workout observation are implemented but have not been
    exercised on the physical iPhone. Unit tests are not device proof, and the offline/retry
    path especially is only proven on hardware.
  steps:
  - Open a completed workout on the iPhone and confirm the report appears after an acknowledged
    completion.
  - Confirm the report shows adherence, VBT, feedback, quality flags and evidence, and the
    "What stood out" section only when the server sends one.
  - Stop the server or corrupt the read and confirm "Report unavailable" retries the read only.
  - Reopen the same report from History; confirm an imported session explains why none exists.
  dont:
  - Do not treat a simulator run as physical-device acceptance.
  - Do not change the report or the server contract while recording acceptance.
afc_5a_historical:
  label: AFC-5a — historical adaptation analysis
  not_before: "2027-01-23"
  doc: docs/AFC.md
  why: >
    AFC-5a is a pre-registered historical counterfactual. It may start only after the Phase 5A
    gate closes on 2027-01-22, and its criteria are written before any number is inspected.
  steps:
  - Confirm the Phase 5A review decision is recorded.
  - Write the 12-week window, the 20-session minimum and the success/failure criteria before
    looking at any result.
  - Evaluate only load and set count, against the e1RM trend at stable effort.
  - Record the outcome as a report; generate no proposal.
  dont:
  - Do not start before the Phase 5A review.
  - Do not inspect outcomes before the criteria are written.
  - Do not propose or apply a prescription change from this analysis.
