# Role-quality evaluator configuration — WP6, shipped.
#
# This file records the owner-approved class values for the resolver's role-specific
# quality level (DEC-RESOLVER-19, DEC-RESOLVER-21) and is wired into the WP6 snapshot.
# A change here moves the resolver fingerprint and the A/B diagnostic.
#
# The classes are ordinal, not weights. Within a role the criteria are compared in the
# order listed in `criteria`; across roles, `role_priority` decides first. Missing data
# is neutral, never a guess. No value here is a percentage-of-e1RM optimisation target.
schema_version: "1.0.0"

role_priority:
  - main
  - secondary
  - accessory

criteria:
  main:
    - specificity
    - exposure
    - suitability
  secondary:
    - complementarity
    - volume_usefulness
    - redundancy
  accessory:
    - coverage
    - productive_volume
    - stimulus_to_fatigue

specificity:
  # Family membership uses the existing review groups, not a new map.
  family_source: strength_coach.prescribe.summary.LIFT_GROUPS
  pattern_source: taxonomy.pattern
  classes:
    same_lift: 3
    same_lift_group: 2
    same_pattern: 1
    other_permitted_pattern: 0

complementarity:
  # Relative to the main lift selected for this assignment, never "is any family known".
  # The materialised volume key (features.volume.volume_target_key) supplies the existing
  # relationship between named patterns; LIFT_GROUPS supplies the display family. A candidate
  # that shares the main lift's pattern, ledger key or family is redundant, not complementary.
  family_source: strength_coach.prescribe.summary.LIFT_GROUPS
  pattern_source: taxonomy.pattern
  key_source: strength_coach.features.volume.volume_target_key
  classes:
    same_pattern: 1
    same_family: 1
    complementary: 3
  missing: 2

volume_usefulness:
  # Assessed against the candidate's own movement-pattern volume target, after removing the
  # candidate's prescribed sets. A pattern already at target without this candidate is
  # redundant; a genuine deficit is useful only while the result stays within tolerance.
  # The weekly volume band remains a separate gate and is not re-scored here.
  tolerance: 0.15
  classes:
    fills_deficit: 3
    within_target: 2
    redundant: 1
  missing: 2

redundancy:
  # Compared with the main lift and the other selected exercises, excluding the candidate's
  # own slot. Pattern, ledger key and lift family are duplicates; a shared primary muscle
  # without a duplicate pattern is a partial overlap. Prescribed set count is not a signal.
  classes:
    duplicate: 1
    partial_overlap: 2
    complementary: 3
  missing: 2

coverage:
  # Accessories only: the candidate's own slot is excluded from the coverage set, so an
  # exercise cannot cover itself. Missing taxonomy is neutral and is never counted as a new
  # uncovered pattern.
  classes:
    uncovered: 3
    covered: 1
  missing: 2

productive_volume:
  # Accessories only. Same existing volume target and tolerance as volume_usefulness; no
  # per-muscle target and no second volume model.
  tolerance: 0.15
  classes:
    fills_deficit: 3
    within_target: 2
    redundant: 1
  missing: 2

stimulus:
  # Ordinal productive-stimulus rating for the accessory stimulus-to-fatigue criterion.
  # Seeded from the evidence-graded local_muscular demand profile
  # (config/exercises/demands.v1.yaml) plus the taxonomy primary_compound/main_lift flags.
  # This is an ordinal assumption, not a measurement; an exercise absent here is unknown and
  # neutral. Reviewed 2026-11-21; see DEC-RESOLVER-32.
  source: config/exercises/demands.v1.yaml
  reviewed_on: "2026-11-21"
  rubric:
    high_compound: 3
    high_isolation: 2
    moderate_compound: 2
    moderate_isolation: 1
    low: 1
    unknown: null
  ratings:
    ab_wheel: 2
    back_extension: 2
    belt_squat: 3
    bench_press: 3
    bench_press_narrow: 3
    bench_press_pause: 3
    bent_over_row: 3
    box_jump: 1
    bulgarian_split_squat: 3
    competition_squat: 3
    dumbbell_bench_press: 3
    dumbbell_chest_supported_row: 2
    dumbbell_row: 3
    front_squat: 3
    hack_squat: 3
    hanging_leg_raise: 2
    high_bar_squat: 3
    incline_db_bench_press: 3
    landmine_press: 2
    lat_pulldown: 2
    lying_leg_curls: 2
    nordic_curl: 2
    overhead_press_seated: 3
    pull_up: 2
    rdl: 2
    seated_cable_row: 3
    split_squat: 3
    ssb_squat: 3
    sumo_deadlift: 3
    trap_bar_deadlift: 3

tax:
  # Ordinal fatigue-cost metadata. `lower_is_better` follows DEC-RESOLVER-21; the stimulus
  # magnitude is the separate `stimulus` block, so this remains a cost axis.
  source: config/selection-tax.v1.yaml
  lower_is_better: true
  mandatory_axes:
    essential:
      - axial
      - systemic
      - skill
    accessory:
      - axial
      - skill
  classes:
    low: 3
    moderate: 2
    high: 1
  missing: 2
  stimulus: separate_rating
  rom: reported_not_ranked

stimulus_to_fatigue:
  # Two ordinal inputs, one class. Higher stimulus and lower mandatory-axis cost are better;
  # the matrix keeps incomparable trade-offs neutral instead of inventing a ratio.
  stimulus_source: stimulus.ratings
  fatigue_source: tax.mandatory_axes
  classes:
    high_low: 4
    high_moderate: 3
    moderate_low: 3
    high_high: 2
    moderate_moderate: 2
    low_low: 2
    moderate_high: 1
    low_moderate: 1
    low_high: 0
  missing: 2

# Repetition and variation are owned by the dwell model (resolver.dwell.*), not by role
# quality: the cap, the deterministic exploration draw and the bounded factor order the pool
# before the beam. Role quality does not score dwell counts or last used (D20, DEC-RESOLVER-22).

exposure:
  # A binary band check, not a point-estimate objective.
  heavy_band: 0.80        # features.monitoring.relative_bands.heavy
  e1rm_quality: ok
  e1rm_age_days:
    full: 14
    partial: 45
  missing: unknown

suitability:
  # will_do=0 and feels_bad=1 remain eligibility filters, never scores.
  explicit_positive: 3
  unrated: 2
  eligible_with_caution: 1
  filters:
    - injury
    - can_do
    - will_do
    - feels_bad
    - pattern

programme_header:
  # One fact method for the envelope; the helpers are internal inputs.
  method: strength_coach.features.programme.header
  helpers:
    - strength_coach.prescribe.undulation.for_week
    - strength_coach.prescribe.top_set.competition_window
    - strength_coach.rules.context.trained_week_index
