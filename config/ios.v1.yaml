# iOS facade (https://github.com/georgesdib/strength-app/blob/main/docs/contracts/IOS-PHASE-2-CONTRACT.md, https://github.com/georgesdib/strength-app/blob/main/docs/contracts/IOS-R7-CONTRACT.md).
#
# mutations_enabled is the first rollback switch: false disables every mutation route with 503
# while bootstrap/today/history/progress remain available. It is read per request so a config
# edit does not require a code change.
#
# issued_plan_ttl_seconds bounds how long a READY plan may be started, measured from the moment
# it became ready. plan_request_ttl_seconds bounds how long a request may sit queued/building
# before it counts as a failed build; it is not the plan's lifetime. The two are deliberately
# separate so a slow build does not eat the owner's window for starting.
#
# receipt_retention_days bounds the idempotency receipts used for safe retries.
# watch_enabled gates minting a watch device; existing watch credentials are revoked explicitly.
mutations_enabled: true
watch_enabled: false
issued_plan_ttl_seconds: 14400
plan_request_ttl_seconds: 900
receipt_retention_days: 30
idle_warn_seconds: 10800
idle_abandon_seconds: 86400

# Validation: issued_plan_ttl 60-86400 seconds; plan_request_ttl 60-3600 seconds; retention
# 1-365 days; idle_warn 60-86400 seconds; idle_abandon 60-604800 seconds. Malformed or out-of-range values fail closed with a server error rather than
# silently enabling a mutation path. plan_request_ttl_seconds is optional; omitting it uses 900.
