# The programme constitution, encoded.
#
# Source: user's programme statement, section 2 ("non-negotiable programme principles").
# Format documented in docs/RULES-FORMAT.md. Rule IDs are stable and must never be
# renumbered or reused; a semantic change requires a new `version` above.
#
# This document is the ONLY place a hard constraint may be declared. Python implements
# the predicates named in `check.fn`; tests prove each one.

document:
  id: programme.constitution
  version: "1.12.0"
  status: draft_for_approval
  effective_from: null            # set when the user approves
  owner: user
  source_text: "programme brief §2"
  changelog:
    - version: "1.0.0"
      change: "Initial encoding of the constitution. Trap-bar and back-extension decisions applied."
    - version: "1.1.0"
      change: "MOD-FAT-001 now reads the computed readiness score alongside the sleep/energy floor; overrides and the 20% combined cap are explicit."
    - version: "1.2.0"
      change: "Core work is part of the accessory pool: ab_wheel and hanging_leg_raise join accessories_and_back_extension, so PRG-DP-001 governs their progression (DEC-CORE-01, docs/CORE-TRAINING.md)."
    - version: "1.3.0"
      change: "Pulling is part of the accessory pool: pull_up joins accessories_and_back_extension and Day B prescribes it (DEC-PULL-01, docs/LONGEVITY-REVIEW.md)."
    - version: "1.4.0"
      change: "The vertical pull is a variant slot: lat_pulldown joins pull_up in accessories_and_back_extension, interchangeable in the slot but progressing on its own load history (DEC-PULL-02)."
    - version: "1.5.0"
      change: "Measured-test e1RM calibration may scale a formula-derived e1RM by a bounded per-lift factor when its CI excludes 1.0 (DEC-E1RM-CAL-02, MOD-E1RM-001)."
    - version: "1.6.0"
      change: "An old e1RM (formula or measured override) is decayed after a grace period, bounded to 10% (DEC-E1RM-DECAY-01, MOD-E1RM-DECAY-001)."
    - version: "1.7.0"
      change: "Exercise selection may apply one categorical substitution per slot when explicitly enabled; the load is re-solved from the selected lift's own history (DEC-SELECT-02, MOD-SELECT-001)."
    - version: "1.8.0"
      change: "The rolling session-type layer replaces the rigid calendar: squat/hinge emphasis alternates, every session has bench or a vertical pull/press, and horizontal row plus vertical press join the accessory pool (DEC-PROGRAMME-02)."
    - version: "1.9.0"
      change: "A conservative MRV cap trims non-essential sets when a movement pattern would exceed its configured weekly maximum recoverable volume; under-MEV is reported, never auto-filled (DEC-VOLUME-02, MOD-VOL-001)."
    - version: "1.10.0"
      change: "A scheduled low-volume deload week joins the reactive triggers; it reduces sets, load and adds RIR under MOD-DELOAD-001 (DEC-PROGRAMME-05)."
    - version: "1.11.0"
      change: "An under-MEV pattern adds one accessory set after three weeks below MEV (MOD-VOL-002), and poor readiness may now reduce main-lift sets as well as accessories (DEC-READINESS-08 amendment)."
    - version: "1.12.0"
      change: "Canonical session types replace the legacy A/B/C label. Direct-erector scheduling reads session.session_type and allows squat/bench_squat only (DEC-SESSION-01)."

# Named collections referenced by scope. Kept here so a rule never lists exercises
# inline and drifts out of sync with the taxonomy.
collections:
  primary_compounds:
    - ssb_squat
    - bench_press
    - bench_press_narrow
    - bench_press_pause
    - trap_bar_deadlift
    - competition_squat        # not a named main lift, but a heavy compound
    - dumbbell_row
    - overhead_press_seated
    - single_leg_db_rdl
  main_lifts:
    - ssb_squat
    - bench_press
    - bench_press_narrow
    - bench_press_pause
    - trap_bar_deadlift
  direct_erector:
    - back_extension
  accessories_and_back_extension:
    - back_extension
    - split_squat
    # Core work is accessory work: it is trained at the end of the session, never before a
    # main lift, and it progresses by the same double-progression rule (DEC-CORE-01).
    - ab_wheel
    - hanging_leg_raise
    # Pulling is accessory work: it balances the pressing and the athlete already trains it.
    - pull_up
    - lat_pulldown
    - dumbbell_row
    - overhead_press_seated
    - single_leg_db_rdl

rules:

  # ---------------------------------------------------------------------------
  - id: PRG-RIR-001
    title: "Effort window on primary compounds (RIR 1-4, no RIR 0, no max singles)"
    severity: veto
    scope:
      exercises: "$primary_compounds"
      sessions: [A, B, C]
    statement: >
      Main lifts at RIR 1-4, with 2-3 as the default target. RIR 0 — a grinding set — is
      prohibited, as are max singles and 1RM testing inside a block. The allowed window is
      deliberately wider than the target: the proximity-to-failure evidence does not support a
      tighter veto (strength gains are similar across a wide RIR range, hypertrophy improves
      closer to failure, and self-reported RIR carries roughly ±1-2 reps of error). See
      docs/RIR-EVIDENCE.md and DEC-RIR-02. (Amended: the trap bar previously carried a tighter
      3-4 window; see DEC-WINDOW-01.)
    params:
      default_rir: {min: 1, max: 4}
      # DEC-WINDOW-01: emptied. The trap bar used to be listed here as {min: 3, max: 4} because a
      # hinge is more forgiving of fatigue at lower effort. In practice the athlete trains it
      # at ~RIR 2, so the tighter window fired on ~43% of trap-bar sets for reasons of
      # window definition rather than effort. The map is intentionally kept so re-adding a
      # per-lift window is a config edit, not a code change.
      per_exercise_rir: {}
      forbid_max_single: true
      max_single_pct_e1rm: 0.90
      # DEC-RIR-01: this value marks a WARM-UP set. It is not an effort rating, so it is
      # excluded from compliance scoring rather than counted as a very easy set.
      warmup_rir_value: 6
      # RIR 1 is now inside the window, so only RIR 0 remains a value to surface rather than
      # trust: it is the one effort rating the constitution forbids on main lifts.
      suspect_rir_values: [0]
    inputs: [set.rir, exercise.id, exercise.primary_compound, set.reps, set.load_kg]
    check:
      fn: primary_compound_rir_window
      args: {report_suspect_separately: true}
    citations:
      - "constitution §2: effort bullet"
    depends_on_data_decisions: [DQ-RIR-01]
    on_fail: {action: veto, code: RIR_FLOOR}
    notes: >
      Scoped to primary_compound rather than main_lift on purpose: the most-performed
      squat in an export may not be one of the constitution's named lifts, so a
      main_lift scope would leave most heavy squatting unregulated. The warm-up marker
      (DEC-RIR-01) is excluded from compliance and from e1RM rather than treated as an
      easy set; RIR 0-1 remain in scope so violations are visible.

  # ---------------------------------------------------------------------------
  - id: PRG-DP-001
    title: "Double progression: hold load until top of range on all sets, then add one increment"
    severity: downgrade
    scope:
      exercises: "$accessories_and_back_extension"
    statement: >
      Hold load until top of rep range on all sets at RIR >= 2, then add the smallest
      increment.
    params:
      requires_top_of_range_on_all_sets: true
      min_rir_at_top: 2
      increment_kg:
        default: 2.5
        per_exercise:
          lateral_raise: 2.5
          ab_wheel: 2.5
          back_extension: 2.5      # 5-10 kg steps only during the ramp (PRG-EREC-001)
      require_comparable_sets: true   # excludes typo/missing-RIR sets from "all sets"
    inputs: [session.history.exercise_id, set.reps, set.rir, set.load_kg, set.flags]
    check:
      fn: double_progression_decision
      args: {window_sessions: 4}
    citations:
      - "constitution §2: double progression bullet"
    depends_on_data_decisions: [DQ-REPS-01, DQ-BW-01, DQ-LOAD-02]
    on_fail: {action: downgrade, code: HOLD_LOAD}
    notes: >
      "Smallest increment" is per-exercise config because real logs contain 0.5, 1.0 and
      2.5 kg steps; a global 2.5 kg constant would be wrong for small lifts. A set with
      a typo flag or a missing RIR is excluded from the "all sets" test rather than
      counted as a pass or a fail.

  # ---------------------------------------------------------------------------
  - id: PRG-SCHED-001
    title: "Direct erector work only on Days A and C, never stacked with a hinge"
    severity: veto
    scope:
      sessions: [A, B, C]
    statement: >
      Back extensions on Days A and C only, never on the hinge day. Do not stack a hinge
      plus direct erector work in the same session. Do not substitute RDLs, good
      mornings, rack pulls or Jefferson curls for the back extension.
    params:
      allowed_session_types: [squat, bench_squat]
      direct_erector_property: direct_erector
      forbid_same_session_as_patterns: [hinge]
      forbid_substitution: true
      substitutable_property: substitutable_for_back_extension
    inputs: [session.session_type, prescription.items.exercise_id, exercise.direct_erector,
             exercise.pattern]
    check:
      fn: direct_erector_scheduling
      args: {}
    citations:
      - "constitution §2: direct spinal-erector work bullet"
    depends_on_data_decisions: [DQ-SESSION-02]
    on_fail: {action: veto, code: ERECTOR_STACKING}
    notes: >
      Written against the `direct_erector` and `pattern` properties, not a name list, so
      a new erector exercise is covered automatically. `substitutable_for_back_extension`
      is what makes "do not substitute" machine-checkable: an RDL cannot satisfy the
      erector dose by proxy. Verification against performed sessions is impossible while
      The canonical session type has to be reconstructed from the log (DQ-SESSION-02).

  # ---------------------------------------------------------------------------
  - id: PRG-EREC-001
    title: "Erector dose ramp over 8-12 weeks, gated on two stable sessions"
    severity: warn
    scope:
      exercises: "$direct_erector"
    statement: >
      Dose-ramped over 8-12 weeks (weeks 1-3 bodyweight, 4-6 add 5-10 kg, 7-9 add a set,
      10-12 consolidate). Progress only if two consecutive sessions are stable with no
      symptom flare.
    params:
      phases:
        - {weeks: [1, 3], added_kg: 0, set_delta: 0, label: bodyweight}
        - {weeks: [4, 6], added_kg: [5, 10], set_delta: 0, label: add_load}
        - {weeks: [7, 9], added_kg: [5, 10], set_delta: 1, label: add_set}
        - {weeks: [10, 12], added_kg: null, set_delta: 0, label: consolidate}
      stability_sessions_required: 2
      stability_metric: [reps_within_1, no_symptom_flare]
      require_symptom_input: true
    inputs: [block.week_index, session.sets, symptom.flare]
    check:
      fn: erector_dose_ramp
      args: {symptom_source: manual}
    citations:
      - "constitution §2: erector progression bullet"
    depends_on_data_decisions: [DQ-BW-01]
    on_fail: {action: warn, code: ERECTOR_RAMP_HOLD}
    notes: >
      Two inputs, surfaced rather than guessed. (1) The symptom signal is manual: the
      athlete logs a pre-session 0-3 back level (symptom_log), and until one exists the
      rule returns `unknown` instead of assuming no flare. (2) Since DEC-BACKEXT-02, historical Hyperextensions
      rows DO count toward this dose, so there is real history to ramp from; week 1 still
      needs an explicit anchor date from the athlete.

  # ---------------------------------------------------------------------------
  - id: PRG-SPINE-001
    title: "Weekly high-fatigue spinal-loading exposure cap"
    severity: veto
    scope:
      unit: iso_week
    statement: >
      Flag any week containing more than ~3 high-fatigue spinal-loading exposures (e.g.
      trap-bar + rack pull + RDL + good morning + hyperextension).
    params:
      cap: 3
      counting: weighted              # ASSUMPTION-02: ordinal spinal_cost, not a measurement
      costs:
        back_extension: 1
        reverse_hyperextension: 1
        trap_bar_deadlift: 2
        rdl: 2
        jefferson_curl: 2
        rack_pull: 3
        good_morning: 3
        conventional_deadlift: 3
      excluded_patterns: [hinge_ballistic]   # kettlebell swings must not consume a slot
    inputs: [session.items.exercise_id, exercise.high_fatigue_spinal, exercise.spinal_cost,
             week.iso_week]
    check:
      fn: weekly_spinal_cap
      args: {include_performed: true}
    citations:
      - "constitution §2: redundancy check bullet"
    depends_on_data_decisions: [DQ-SESSION-01]
    on_fail: {action: veto, code: SPINAL_CAP}
    notes: >
      The constitution says "~3 exposures" without defining an exposure. Measured on
      distinct exercise types the cap almost never fires, which would make the rule
      decorative; measured on sets it would fire constantly. A weighted sum of
      spinal_cost is the middle reading and is explicitly an assumption.

# ---------------------------------------------------------------------------
# Modifiers transform a prescription; they do not pass or fail.
# Applied by the prescription engine before the policy engine evaluates the result.
# ---------------------------------------------------------------------------
modifiers:

  - id: MOD-DELOAD-001
    title: "Scheduled or reactive low-volume deload"
    statement: >
      When a deload is due — the configured block week or a reactive trigger — reduce one set
      from each item (never below the configured minimum), reduce load by about 10% and add one
      RIR. Keep the session's movement pattern; a deload is a low-volume week, not a new block.
      A scheduled deload needs a declared block anchor.
    when:
      any:
        - {input: deload.due, op: "==", value: true}
    then:
      set_reduction: all_items
      load_multiplier: 0.90
      rir_bump: 1
    availability:
      status: available
      reason: "Config polices scheduled and reactive triggers (DEC-PROGRAMME-05, ASSUMPTION-32)."

  - id: MOD-E1RM-001
    title: "Measured e1RM calibration"
    statement: >
      When a lift has at least three measured tests and a 95% bootstrap CI of the median
      measured/formula ratio excludes 1.0, scale the formula-derived e1RM by that median
      ratio, bounded to +/-10%. Measured e1RM overrides are never adjusted.
    when:
      any:
        - {input: e1rm_calibration.applied, op: "==", value: true}
    then:
      load_multiplier: [0.90, 1.10]
    availability:
      status: available
      reason: "Computed from measured tests (DEC-E1RM-CAL-02, ASSUMPTION-26)."

  - id: MOD-E1RM-DECAY-001
    title: "Age decay of an old e1RM"
    statement: >
      After a 21-day grace period, reduce the e1RM used as the load basis by 1% per week,
      capped at 10%. The decay applies to formula estimates and measured overrides; the
      continuity modifier remains separate.
    when:
      any:
        - {input: e1rm.age_days, op: ">", value: 21}
    then:
      load_multiplier: [0.90, 1.0]
    availability:
      status: available
      reason: "Age of the selected e1RM (DEC-E1RM-DECAY-01, ASSUMPTION-27)."

  - id: MOD-GAP-001
    title: "Return-to-training adjustment"
    statement: >
      After a gap in training, add one RIR for the first week back; from 28 days also reduce
      load about 5%; from 56 days reduce about 10% and step the erector ramp back one stage.
    when:
      any:
        - {input: session.gap_days, op: ">=", value: 14}
    then:
      load_multiplier: [0.90, 1.0]
      rir_bump: 1
    availability:
      status: available
      reason: "The gap is detected from stored sessions (DEC-CONTINUITY-01)."

  - id: MOD-FAT-001
    title: "Fatigue downgrade"
    statement: >
      If the computed readiness score is below 0.80, or sleep/energy is at or below 2, or
      the first working set is RIR 0-1 at a load that was RIR 2-3 last session, reduce the
      load by the configured score factor (or use the reduced session). A global/category
      readiness override wins over the computed score. The combined readiness + continuity
      reduction is capped at 20%; constraints and injury ceilings are never diluted by it.
    when:
      any:
        - {input: readiness.score, op: "<", value: 0.80}
        - {input: readiness.sleep, op: "<=", value: 2}
        - {input: readiness.energy, op: "<=", value: 2}
        - {input: first_set_rir_drop.vs_prior_session, op: ">=", value: 1}
    then:
      load_multiplier: [0.85, 1.0]
      rir_bump: [0, 2]
      or_prescription: reduced_session
    guard:
      # Readiness is 1-5 with HIGHER BETTER. A guard is required here because the
      # intuitive reading of "Stress = 5" is inverted.
      scale_direction: higher_is_better
      fields: [sleep, energy, mood, soreness, stress, nutrition, hydration]
    notes: >
      The "or" is deliberate: which branch is chosen depends on how many factors fired,
      and that choice belongs to the deterministic engine, not to an LLM. The score,
      override and cap are documented in docs/READINESS-SCORE.md (DEC-READINESS-06/07).

  - id: MOD-VOL-001
    title: "Conservative weekly MRV cap"
    statement: >
      If the proposed session plus the prior seven days would put a movement pattern above its
      configured maximum recoverable volume (MRV), trim non-essential sets first. Under-MEV is
      handled only by the separate accessory progression in MOD-VOL-002; never silently cut an
      essential item, and treat MRV as a configurable coaching landmark rather than a measured
      individual threshold.
    when:
      any:
        - {input: volume.projected_sets, op: ">", value: 0}
    then:
      set_reduction: accessory_only
    availability:
      status: available
      reason: "Volume ledger plus configured landmarks (DEC-VOLUME-02, ASSUMPTION-31)."

  - id: MOD-VOL-002
    title: "Under-MEV accessory progression"
    statement: >
      When a movement pattern has been below its configured MEV for three weeks, add one set
      to the first non-essential item in that pattern, up to the configured maximum. Never add
      volume to a main lift through this rule; the MRV cap still applies afterwards.
    when:
      any:
        - {input: volume.under_mev, op: "==", value: true}
    then:
      set_increase: accessory_only_one
    availability:
      status: available
      reason: "Volume ledger and configured landmarks (DEC-VOLUME-03, ASSUMPTION-33)."

  - id: MOD-SELECT-001
    title: "Categorical exercise substitution from the filtered selector"
    statement: >
      When exercise selection is explicitly enabled, at most one allowed candidate may replace
      the slot's current exercise. Candidates come only from the configured slot list after
      hard constraints, suitability and injury penalties; an LLM may choose only from that
      Python-filtered list. The load is re-solved from the selected lift's own history, never
      copied from the replaced lift, and all normal rules and validators still apply.
    when:
      any:
        - {input: selection.applied, op: "==", value: true}
    then:
      substitution: one_per_slot
    availability:
      status: available
      reason: "Shadow selector plus explicit UI/CLI opt-in (DEC-SELECT-02)."

  - id: MOD-BACK-001
    title: "Back symptom flare deload"
    statement: >
      If back symptoms rise and do not settle in 24-48 h, cut erector volume to the
      weeks 1-3 dose and hold main lifts at RIR 3-4 for a week.
    when:
      any:
        - {input: symptom.back_flare, op: "==", value: true}
    then:
      erector_dose: "weeks_1_3"
      main_lift_rir_override: {min: 3, max: 4}
      duration_days: 7
    availability:
      status: available
      reason: "Symptom input exists: symptom_log records a pre-session 0-3 back level (DEC-SYMPTOM-01/02)."
