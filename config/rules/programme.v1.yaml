# The programme constitution, encoded.
#
# Source: user's programme statement, section 2 ("non-negotiable programme principles").
# Format documented in docs/RULES-FORMAT.md. Rule IDs are stable and must never be
# renumbered or reused; a semantic change requires a new `version` above.
#
# This document is the ONLY place a hard constraint may be declared. Python implements
# the predicates named in `check.fn`; tests prove each one.

document:
  id: programme.constitution
  version: "1.0.0"
  status: draft_for_approval
  effective_from: null            # set when the user approves
  owner: user
  source_text: "programme brief §2"
  changelog:
    - version: "1.0.0"
      change: "Initial encoding of the constitution. Trap-bar and back-extension decisions applied."

# Named collections referenced by scope. Kept here so a rule never lists exercises
# inline and drifts out of sync with the taxonomy.
collections:
  primary_compounds:
    - ssb_squat
    - bench_press
    - bench_press_narrow
    - bench_press_pause
    - trap_bar_deadlift
    - competition_squat        # not a named main lift, but a heavy compound
  main_lifts:
    - ssb_squat
    - bench_press
    - bench_press_narrow
    - bench_press_pause
    - trap_bar_deadlift
  direct_erector:
    - back_extension
  accessories_and_back_extension:
    - back_extension
    - lateral_raise
    - split_squat

rules:

  # ---------------------------------------------------------------------------
  - id: PRG-RIR-001
    title: "Effort window on primary compounds (no RIR 0-1, no max singles)"
    severity: veto
    scope:
      exercises: "$primary_compounds"
      sessions: [A, B, C]
    statement: >
      Main lifts at RIR 2-3. No RIR 0-1 sets, no max singles, no 1RM testing inside a block.
      This is a hard rule, not a preference. (Amended: the trap bar previously carried a
      tighter 3-4 window; see DEC-WINDOW-01.)
    params:
      default_rir: {min: 2, max: 3}
      # DEC-WINDOW-01: emptied. The trap bar used to be listed here as {min: 3, max: 4} because a
      # hinge is more forgiving of fatigue at lower effort. In practice the athlete trains it
      # at ~RIR 2, so the tighter window fired on ~43% of trap-bar sets for reasons of
      # window definition rather than effort. The map is intentionally kept so re-adding a
      # per-lift window is a config edit, not a code change.
      per_exercise_rir: {}
      forbid_max_single: true
      max_single_pct_e1rm: 0.90
      # DEC-RIR-01: this value marks a WARM-UP set. It is not an effort rating, so it is
      # excluded from compliance scoring rather than counted as a very easy set.
      warmup_rir_value: 6
      suspect_rir_values: [0, 1]      # logged effort that must be surfaced, not trusted
    inputs: [set.rir, exercise.id, exercise.primary_compound, set.reps, set.load_kg]
    check:
      fn: primary_compound_rir_window
      args: {report_suspect_separately: true}
    citations:
      - "constitution §2: effort bullet"
    depends_on_data_decisions: [DQ-RIR-01]
    on_fail: {action: veto, code: RIR_FLOOR}
    notes: >
      Scoped to primary_compound rather than main_lift on purpose: the most-performed
      squat in an export may not be one of the constitution's named lifts, so a
      main_lift scope would leave most heavy squatting unregulated. The warm-up marker
      (DEC-RIR-01) is excluded from compliance and from e1RM rather than treated as an
      easy set; RIR 0-1 remain in scope so violations are visible.

  # ---------------------------------------------------------------------------
  - id: PRG-DP-001
    title: "Double progression: hold load until top of range on all sets, then add one increment"
    severity: downgrade
    scope:
      exercises: "$accessories_and_back_extension"
    statement: >
      Hold load until top of rep range on all sets at RIR >= 2, then add the smallest
      increment.
    params:
      requires_top_of_range_on_all_sets: true
      min_rir_at_top: 2
      increment_kg:
        default: 2.5
        per_exercise:
          lateral_raise: 2.5
          ab_wheel: 2.5
          back_extension: 2.5      # 5-10 kg steps only during the ramp (PRG-EREC-001)
      require_comparable_sets: true   # excludes typo/missing-RIR sets from "all sets"
    inputs: [session.history.exercise_id, set.reps, set.rir, set.load_kg, set.flags]
    check:
      fn: double_progression_decision
      args: {window_sessions: 4}
    citations:
      - "constitution §2: double progression bullet"
    depends_on_data_decisions: [DQ-REPS-01, DQ-BW-01, DQ-LOAD-02]
    on_fail: {action: downgrade, code: HOLD_LOAD}
    notes: >
      "Smallest increment" is per-exercise config because real logs contain 0.5, 1.0 and
      2.5 kg steps; a global 2.5 kg constant would be wrong for small lifts. A set with
      a typo flag or a missing RIR is excluded from the "all sets" test rather than
      counted as a pass or a fail.

  # ---------------------------------------------------------------------------
  - id: PRG-SCHED-001
    title: "Direct erector work only on Days A and C, never stacked with a hinge"
    severity: veto
    scope:
      sessions: [A, B, C]
    statement: >
      Back extensions on Days A and C only, never on the hinge day. Do not stack a hinge
      plus direct erector work in the same session. Do not substitute RDLs, good
      mornings, rack pulls or Jefferson curls for the back extension.
    params:
      allowed_days: [A, C]
      direct_erector_property: direct_erector
      forbid_same_session_as_patterns: [hinge]
      forbid_substitution: true
      substitutable_property: substitutable_for_back_extension
    inputs: [session.day, prescription.items.exercise_id, exercise.direct_erector,
             exercise.pattern]
    check:
      fn: direct_erector_scheduling
      args: {}
    citations:
      - "constitution §2: direct spinal-erector work bullet"
    depends_on_data_decisions: [DQ-SESSION-02]
    on_fail: {action: veto, code: ERECTOR_STACKING}
    notes: >
      Written against the `direct_erector` and `pattern` properties, not a name list, so
      a new erector exercise is covered automatically. `substitutable_for_back_extension`
      is what makes "do not substitute" machine-checkable: an RDL cannot satisfy the
      erector dose by proxy. Verification against performed sessions is impossible while
      Day A/B/C has to be retrofitted from the log (DQ-SESSION-02).

  # ---------------------------------------------------------------------------
  - id: PRG-EREC-001
    title: "Erector dose ramp over 8-12 weeks, gated on two stable sessions"
    severity: warn
    scope:
      exercises: "$direct_erector"
    statement: >
      Dose-ramped over 8-12 weeks (weeks 1-3 bodyweight, 4-6 add 5-10 kg, 7-9 add a set,
      10-12 consolidate). Progress only if two consecutive sessions are stable with no
      symptom flare.
    params:
      phases:
        - {weeks: [1, 3], added_kg: 0, set_delta: 0, label: bodyweight}
        - {weeks: [4, 6], added_kg: [5, 10], set_delta: 0, label: add_load}
        - {weeks: [7, 9], added_kg: [5, 10], set_delta: 1, label: add_set}
        - {weeks: [10, 12], added_kg: null, set_delta: 0, label: consolidate}
      stability_sessions_required: 2
      stability_metric: [reps_within_1, no_symptom_flare]
      require_symptom_input: true
    inputs: [block.week_index, session.sets, symptom.flare]
    check:
      fn: erector_dose_ramp
      args: {symptom_source: manual}
    citations:
      - "constitution §2: erector progression bullet"
    depends_on_data_decisions: [DQ-BW-01]
    on_fail: {action: warn, code: ERECTOR_RAMP_HOLD}
    notes: >
      Two blockers, surfaced rather than guessed. (1) There is no symptom field in the
      source data, so `symptom.flare` is unavailable and the rule returns `unknown`
      instead of assuming no flare. (2) Since DEC-BACKEXT-02, historical Hyperextensions
      rows DO count toward this dose, so there is real history to ramp from; week 1 still
      needs an explicit anchor date from the athlete.

  # ---------------------------------------------------------------------------
  - id: PRG-SPINE-001
    title: "Weekly high-fatigue spinal-loading exposure cap"
    severity: veto
    scope:
      unit: iso_week
    statement: >
      Flag any week containing more than ~3 high-fatigue spinal-loading exposures (e.g.
      trap-bar + rack pull + RDL + good morning + hyperextension).
    params:
      cap: 3
      counting: weighted              # ASSUMPTION-02: ordinal spinal_cost, not a measurement
      costs:
        back_extension: 1
        reverse_hyperextension: 1
        trap_bar_deadlift: 2
        rdl: 2
        jefferson_curl: 2
        rack_pull: 3
        good_morning: 3
        conventional_deadlift: 3
      excluded_patterns: [hinge_ballistic]   # kettlebell swings must not consume a slot
    inputs: [session.items.exercise_id, exercise.high_fatigue_spinal, exercise.spinal_cost,
             week.iso_week]
    check:
      fn: weekly_spinal_cap
      args: {include_performed: true}
    citations:
      - "constitution §2: redundancy check bullet"
    depends_on_data_decisions: [DQ-SESSION-01]
    on_fail: {action: veto, code: SPINAL_CAP}
    notes: >
      The constitution says "~3 exposures" without defining an exposure. Measured on
      distinct exercise types the cap almost never fires, which would make the rule
      decorative; measured on sets it would fire constantly. A weighted sum of
      spinal_cost is the middle reading and is explicitly an assumption.

# ---------------------------------------------------------------------------
# Modifiers transform a prescription; they do not pass or fail.
# Applied by the prescription engine before the policy engine evaluates the result.
# ---------------------------------------------------------------------------
modifiers:

  - id: MOD-FAT-001
    title: "Fatigue downgrade"
    statement: >
      If sleep <= 2, or energy <= 2, or the first working set is RIR 0-1 at a load that
      was RIR 2-3 last session, reduce load 5-10% or use the reduced session.
    when:
      any:
        - {input: readiness.sleep, op: "<=", value: 2}
        - {input: readiness.energy, op: "<=", value: 2}
        - {input: first_set_rir_drop.vs_prior_session, op: ">=", value: 1}
    then:
      load_multiplier: [0.90, 0.95]
      or_prescription: reduced_session
    guard:
      # Readiness is 1-5 with HIGHER BETTER. A guard is required here because the
      # intuitive reading of "Stress = 5" is inverted.
      scale_direction: higher_is_better
      fields: [sleep, energy, mood, soreness, stress, nutrition, hydration]
    notes: >
      The "or" is deliberate: which branch is chosen depends on how many factors fired,
      and that choice belongs to the deterministic engine, not to an LLM.

  - id: MOD-BACK-001
    title: "Back symptom flare deload"
    statement: >
      If back symptoms rise and do not settle in 24-48 h, cut erector volume to the
      weeks 1-3 dose and hold main lifts at RIR 3-4 for a week.
    when:
      any:
        - {input: symptom.back_flare, op: "==", value: true}
    then:
      erector_dose: "weeks_1_3"
      main_lift_rir_override: {min: 3, max: 4}
      duration_days: 7
    availability:
      status: blocked
      reason: "No symptom field exists in either CSV. Requires a manual input (Q5)."
