# Indirect volume credit for step 8. Pattern-level, inherited by every exercise whose primary
# pattern maps to the key. Direct work counts 1.0; the listed secondary group counts 0.25.
# The lower weight avoids letting an unvalidated reciprocal/core assumption dominate a low
# direct target. This is a modelling assumption, not a measured cross-group equivalence.
schema_version: "1.0.0"

by_group:
  horizontal_push: {vertical_push: 0.25}
  vertical_push: {horizontal_push: 0.25}
  horizontal_pull: {vertical_pull: 0.25}
  vertical_pull: {horizontal_pull: 0.25}
  squat: {core: 0.25}
  hinge: {core: 0.25}
  hinge_unilateral: {hinge: 0.25}
