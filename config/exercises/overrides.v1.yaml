# Exercise catalogue overrides written by the local UI (Exercises tab).
# `log_names` are exact strings; ids are immutable.

schema_version: 1.0.0
entities:
  bench_press_narrow:
    primary_muscles:
    - biceps
    - chest
    - front_delts
    - triceps
  pull_up:
    primary_muscles:
    - lats
    - upper_back
    - upper_trap
  dumbbell_row:
    primary_muscles:
    - lats
    - upper_back
  overhead_press_seated:
    primary_muscles:
    - front_delts
    - triceps
  ab_wheel:
    loadable: false
    primary_muscles:
    - abs
  ssb_squat:
    primary_muscles:
    - erectors
    - glutes
    - quadriceps
    spinal_cost: 0.5
  hanging_leg_raise:
    primary_muscles:
    - abs
    loadable: false
