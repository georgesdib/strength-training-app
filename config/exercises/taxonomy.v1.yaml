alias_overrides:
  - match: "Competition Deadlift"
    canonical: trap_bar_deadlift
    historical_canonical: sumo_deadlift
    switch_date: "2026-08-17"       # ASSUMPTION-05: "about two months ago", athlete's words
    applies_to_history: true
    decision: DEC-TRAPBAR-02
    reason: >
      "Competition Deadlift" was a sumo pull until the athlete switched to the trap bar around
      2026-08-17, and means the trap bar from then on. Date-scoped so the history is not
      relabelled in bulk; it may change again, especially with manual logging.

  - match: "Hyperextensions"
    canonical: hyperextension
    applies_to_history: true        # historical rows keep their own identity
    forward_alias: back_extension   # ...but new prescriptions may use this name
    decision: DEC-BACKEXT-02
    reason: "Same movement; historical rows count as back-extension history (DEC-BACKEXT-02)."

  - match: "Back Extension"
    canonical: back_extension
    applies_to_history: false       # no such rows exist; forward-only name
    decision: DEC-BACKEXT-01

  - match: "Bench Press (narrow grip)"
    canonical: bench_press_narrow
    applies_to_history: true
    note: "Playbook says 'close-grip'; the app calls it narrow grip."

# ---------------------------------------------------------------------------
# Ordered regex fallback for the remaining names. First match wins, so specific
# patterns MUST precede general ones ("flat-bench sit-ups" before "bench",
# "jump squat" before "squat", "reverse nordic curl" before "curl").
#
# Accessories resolve to a `pattern:<family>` slug rather than a hand-written
# entity. Programme lifts get real entities because the rules address them by
# name; accessories only need a stable family for tonnage/rotation metrics.
# ---------------------------------------------------------------------------
classification_patterns:

  # --- core / isometric (must precede "bench" via flat-bench sit-ups) -------
  - pattern: '(?i)plank'
    canonical: plank
  - pattern: '(?i)carry'
    canonical: carry
  - pattern: '(?i)ab wheel'
    canonical: ab_wheel
  - pattern: '(?i)hanging (leg raise|pike)'
    canonical: hanging_leg_raise
  - pattern: '(?i)bird.?dog'
    synthetic: {pattern: core_stability, bodyweight_type: true, time_based: false}
  - pattern: '(?i)sit.?ups?|cable chop|woodchop|pallof'
    synthetic: {pattern: core, time_based: false}

  # --- direct erector / hinge family (specific before generic) -------------
  - pattern: '(?i)jefferson'
    canonical: jefferson_curl
  - pattern: '(?i)reverse hyper'
    canonical: reverse_hyperextension
  - pattern: '(?i)hyperextension'
    canonical: hyperextension
  - pattern: '(?i)good morning'
    canonical: good_morning
  - pattern: '(?i)rack pull'
    canonical: rack_pull
  - pattern: '(?i)single.leg.*\brdl\b|single leg.*romanian'
    synthetic:
      pattern: hinge_unilateral
      erector_family: true
      high_fatigue_spinal: false
      loadable: true
      time_based: false
  - pattern: '(?i)romanian deadlift|stiff.leg deadlift|\brdl\b'
    canonical: rdl
  - pattern: '(?i)kettlebell swing|kb swing'
    synthetic:
      pattern: hinge_ballistic
      erector_family: true
      # Ballistic, low spinal fatigue: must not consume a high-fatigue slot.
      high_fatigue_spinal: false
      loadable: true
      time_based: false
  - pattern: '(?i)deadlift'
    # Any remaining deadlift variant is a hinge and does count as a high-fatigue
    # spinal exposure (deficit, pause, chains, bands, to-knees, from-block...).
    synthetic:
      pattern: hinge
      high_fatigue_spinal: true
      erector_family: true
      direct_erector: false
      vbt_family: hinge
      loadable: true
      time_based: false

  # --- pulls ---------------------------------------------------------------
  - pattern: '(?i)straight.?arm pulldown'
    synthetic: {pattern: lat_isolation, loadable: true, time_based: false}
  - pattern: '(?i)pulldown'
    canonical: lat_pulldown
  - pattern: '(?i)pull.?ups?|chin.?ups?'
    canonical: pull_up
  - pattern: '(?i)face pull'
    synthetic: {pattern: rear_delt_pull, loadable: true, time_based: false}
  - pattern: '(?i)upright row'
    synthetic: {pattern: shoulder_abduction, loadable: true, time_based: false}
  - pattern: '(?i)row'
    synthetic: {pattern: horizontal_pull, loadable: true, time_based: false}

  # --- knee flexion/extension (MUST precede the generic "curl" pattern,
  #     otherwise "Lying Leg Curls" resolves to a biceps curl) ----------------
  - pattern: '(?i)leg curl|leg curls'
    synthetic: {pattern: knee_flexion, loadable: true, time_based: false}
  - pattern: '(?i)leg extension'
    synthetic: {pattern: knee_extension, loadable: true, time_based: false}

  # --- arms (after jefferson/nordic so those are not eaten by "curl") ------
  - pattern: '(?i)nordic'
    synthetic: {pattern: hamstring_eccentric, bodyweight_type: true, time_based: false}
  - pattern: '(?i)glute kickback'
    synthetic: {pattern: hip_extension, loadable: true, time_based: false}
  - pattern: '(?i)kickback|tricep|triceps'
    synthetic: {pattern: triceps_extension, loadable: true, time_based: false}
  - pattern: '(?i)curl'
    synthetic: {pattern: elbow_flexion, loadable: true, time_based: false}

  # --- shoulders / chest ---------------------------------------------------
  - pattern: '(?i)external rotation|rotator'
    synthetic: {pattern: rotator_cuff, loadable: true, time_based: false}
  - pattern: '(?i)(lateral|front|rear).*raise'
    synthetic: {pattern: shoulder_abduction, loadable: true, time_based: false}
  - pattern: '(?i)shrug'
    synthetic: {pattern: upper_trap, loadable: true, time_based: false}
  - pattern: '(?i)fly|flyes|flye'
    synthetic: {pattern: horizontal_push_isolation, loadable: true, time_based: false}
  - pattern: '(?i)pullover'
    synthetic: {pattern: lat_isolation, loadable: true, time_based: false}
  - pattern: '(?i)^dips?\b|push.?ups?'
    synthetic: {pattern: horizontal_push_bw, bodyweight_type: true, loadable: true, time_based: false}

  # --- legs ----------------------------------------------------------------
  - pattern: '(?i)calf|calves'
    synthetic: {pattern: plantar_flexion, loadable: true, time_based: false}
  - pattern: '(?i)hip thrust|glute bridge|pull.?through'
    synthetic: {pattern: hip_extension, loadable: true, time_based: false}
  - pattern: '(?i)box jump'
    canonical: box_jump
  - pattern: '(?i)jump'
    # Must precede "squat": Jump Squats are power work, not a squat stimulus.
    synthetic: {pattern: power_jump, loadable: true, time_based: false}
  - pattern: '(?i)lunge|lunge'
    synthetic: {pattern: squat_unilateral, loadable: true, time_based: false}

  # --- broad patterns last -------------------------------------------------
  - pattern: '(?i)overhead press|military press|shoulder press|dumbbell press'
    synthetic: {pattern: vertical_push, loadable: true, time_based: false}
  - pattern: '(?i)squat'
    synthetic: {pattern: squat, erector_family: false, loadable: true, time_based: false}
  - pattern: '(?i)bench|press'
    synthetic: {pattern: horizontal_push, loadable: true, time_based: false}

