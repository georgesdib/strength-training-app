# Exercise taxonomy — single source of truth for "what is this exercise?"
#
# Downstream code NEVER branches on the raw log string. It resolves every row to a
# canonical `id` through this file, then branches on the id's *properties*.
# That is what lets a new exercise be added without touching ingestion, features,
# prescription or agent prompts.
#
# Resolution order (first match wins, implemented in strength_coach.utils.exercises):
#   1. `alias_overrides`  — exact string match, highest priority
#   2. entity log_names   — exact string match
#   3. `classification_patterns` — ordered regex, first match wins
#   4. unmatched          — returns None and is reported, never guessed
#
# `applies_to_history` is the load-bearing flag. See docs/RULES-FORMAT.md §2.

schema_version: "1.0.0"
decisions:
  # Recorded verbatim from the athlete. This block is audit trail, not config.
  - id: DEC-TRAPBAR-01
    decision: >
      "Competition Deadlift" in the Sheiko Gold log IS the trap-bar deadlift.
      Applies historically and going forward.
    consequence: >
      The constitution's Day B main lift now has a substantial historical record to
      calibrate loads and velocity from. Q1 is closed. Caveat retained as
      ASSUMPTION-01: the physical implement is inferred from the log name, not
      verified.
  - id: DEC-TRAPBAR-02
    decision: >
      "Competition Deadlift" is date-scoped: sumo deadlift before 2026-08-17 (approximate,
      ASSUMPTION-05), trap-bar deadlift from then on and going forward.
    consequence: >
      Historical rows resolve by their own date; the trap bar's strength history starts at the
      switch, and sumo history is its own entity. DEC-TRAPBAR-01's blanket equivalence is
      withdrawn. The switch date is config and may change again, especially if manual logging
      makes the implement explicit.
  - id: DEC-BACKEXT-01
    decision: >
      Back extension is the same movement as "Hyperextensions" going forward.
    consequence: >
      New prescriptions name `back_extension`; the alias is directional so historical
      rows keep their own entity id.
  - id: DEC-BACKEXT-02
    decision: >
      AMENDMENT (2026-10-17): historical `Hyperextensions` rows DO count as
      back-extension history, including for the erector dose ramp.
    consequence: >
      The second half of DEC-BACKEXT-01 ("must not be projected backwards") is
      withdrawn. Identity is still preserved — rows keep the `hyperextension` id and
      no equivalence is inferred for any other purpose — but history lookups and the
      ramp may use them. Implemented as `history_equivalent_of` on the entity and
      `utils.exercises.history_equivalents`.

# ---------------------------------------------------------------------------
# Canonical entities. `id` is the only identifier used by code and by agents.
#
# `day_roles` lists the canonical session types (config/templates/session-types.v1.yaml)
# in which an exercise is programmed or allowed. It is descriptive metadata for the UI and
# for reading the taxonomy; scheduling reads the templates, not this field. The retired
# A/B/C labels are gone (DEC-SESSION-01).
# ---------------------------------------------------------------------------
entities:

  # ---- Main lifts (constitution §2) ---------------------------------------
  ssb_squat:
    display: "SSB Squat"
    log_names: ["Safety Squat Bar"]
    pattern: squat
    main_lift: true
    primary_compound: true
    day_roles: [squat, bench_squat]
    primary_muscles: [quadriceps, glutes, erectors]
    erector_family: false          # loaded but not *direct* erector work
    # Not counted toward the weekly spinal cap: the SSB is the most upright squat variant
    # (Hecker 2019: trunk flexion -7.3 deg vs a standard bar). See docs/SPINAL-COST.md.
    vbt_family: squat
    default_rir_target: [2, 3]
    loadable: true
    time_based: false

  competition_squat:
    display: "Competition Squat"
    log_names: ["Competition Squat"]
    pattern: squat
    main_lift: false               # not a constitution main lift...
    # ...but it is a heavy compound, so the RIR effort window still applies to it.
    # A rule scoped to main_lift alone would ignore whichever squat is actually
    # performed most, which is often not one of the constitution's named lifts.
    primary_compound: true
    programme_slot_of: ssb_squat   # substitute for SSB elsewhere; bench_squat programs it directly (DEC-PROGRAMME-08)
    # DEC-SPINE-05 (2026-10-25): the low-bar competition squat now counts as one high-fatigue
    # spinal exposure. It has the greatest forward lean and erector activity of the squat
    # variants (Glassbrook 2017). The weekly cap was raised to 6 at the same time.
    erector_family: false
    high_fatigue_spinal: true
    spinal_cost: 1
    vbt_family: squat
    loadable: true
    time_based: false

  bench_press:
    display: "Bench Press"
    log_names: ["Competition Bench Press"]
    pattern: horizontal_push
    main_lift: true
    primary_compound: true
    # The hinge session uses the narrow-grip/pause variants, so plain bench is not in it.
    day_roles: [squat, bench_squat, bench_hinge]
    primary_muscles: [chest, triceps, front_delts]
    erector_family: false
    vbt_family: bench
    default_rir_target: [2, 3]
    loadable: true
    time_based: false

  bench_press_narrow:
    display: "Bench Press (narrow grip)"
    log_names: ["Bench Press (narrow grip)"]
    pattern: horizontal_push
    main_lift: true                # hinge-session close-grip slot
    primary_compound: true
    day_roles: [hinge]
    vbt_family: bench              # pools with bench for calibration
    default_rir_target: [2, 3]
    loadable: true
    time_based: false

  bench_press_pause:
    display: "Bench Press (pause)"
    # The constitution's Day B allows "close-grip OR pause bench", so the pause
    # variants are first-class programme lifts, not generic accessories.
    log_names:
      - "Bench Press (2s pause)"
      - "Bench Press (3s pause)"
      - "Bench Press (5s pause)"
      - "Bench Press (2s pause at sticking point)"
    pattern: horizontal_push
    main_lift: true
    primary_compound: true
    day_roles: [hinge]
    vbt_family: bench
    default_rir_target: [2, 3]
    loadable: true
    time_based: false

  trap_bar_deadlift:
    display: "Trap-Bar Deadlift"
    # DEC-TRAPBAR-02: "Competition Deadlift" only means the trap bar from the switch date
    # forward. The old log name is handled by the date-scoped alias below, not here.
    log_names: ["Trap Bar Deadlift"]
    pattern: hinge
    main_lift: true
    primary_compound: true
    day_roles: [hinge]
    primary_muscles: [glutes, hamstrings, erectors, upper_back]
    erector_family: true
    # Hinge loading is *indirect* erector work: it never satisfies the direct
    # erector dose, and it must never be stacked with it (constitution §2).
    direct_erector: false
    high_fatigue_spinal: true       # counts toward the weekly spinal cap
    # Ordinal 1-3, not a measurement (ASSUMPTION-02; docs/SPINAL-COST.md). Trap bar has a
    # lower peak lumbar moment than a straight bar (Swinton 2011). Same bin as sumo because no
    # head-to-head study ranks them.
    spinal_cost: 2
    # Its own family: a trap-bar pull does not share a load-velocity curve with sumo or RDL,
    # so pooling them would manufacture a target (DEC-TRAPBAR-02, docs/VBT-EVIDENCE.md).
    vbt_family: trap_bar
    default_rir_target: [2, 3]      # target band; the allowed window is 1-4 (DEC-RIR-02)
    loadable: true
    time_based: false

  sumo_deadlift:
    display: "Sumo Deadlift"
    # What "Competition Deadlift" actually was before the switch (DEC-TRAPBAR-02); it is also
    # the bench+hinge support lift from DEC-SPINE-05, so new logs need a direct name.
    log_names: ["Sumo Deadlift"]
    pattern: hinge
    main_lift: false                # not a constitution main lift, but programmed in bench_hinge
    primary_compound: true          # it was a competition lift, so effort rules still apply
    day_roles: []
    primary_muscles: [glutes, hamstrings, erectors, upper_back]
    erector_family: true
    direct_erector: false
    high_fatigue_spinal: true
    # Lower erector activation and more upright than conventional (Hanen 2025), but no direct
    # sumo-vs-trap measurement. Set to 2.5 by the programme owner: between the trap bar and a
    # conventional pull. Half-step is a design choice, not a measured value (docs/SPINAL-COST.md).
    spinal_cost: 2.5
    vbt_family: sumo
    loadable: true
    time_based: false

  # ---- Direct erector work (constitution §2) ------------------------------
  back_extension:
    display: "Back Extension"
    # DEC-BACKEXT-01: canonical erector movement from the decision date forward.
    log_names: ["Back Extension"]
    pattern: erector_extension
    main_lift: false
    # Allowed on both squat-emphasis types (PRG-SCHED-001); the template fills only `squat`
    # so a normal week stays at the spinal cap.
    day_roles: [squat, bench_squat]
    primary_muscles: [erectors]
    bodyweight_type: true          # 0 or ~bodyweight both appear in Weight_Used
    e1rm_applicable: false         # not a 1RM lift; an "e1RM" here is a meaningless index
    erector_family: true
    direct_erector: true
    high_fatigue_spinal: true
    spinal_cost: 1
    vbt_family: null               # not a VBT lift
    loadable: true
    time_based: false
    progressive_dose: true         # subject to the 8-12 week ramp

  hyperextension:
    display: "Hyperextension (historical)"
    # Historical rows keep their own id, but they DO count as back-extension history
    # (DEC-BACKEXT-02, amending DEC-BACKEXT-01).
    history_equivalent_of: back_extension
    log_names: ["Hyperextensions"]
    pattern: erector_extension
    main_lift: false
    bodyweight_type: true
    e1rm_applicable: false
    direct_erector: true
    erector_family: true
    high_fatigue_spinal: true
    spinal_cost: 1
    counts_toward_back_extension_dose: false
    applies_to_history_only: true
    loadable: true
    time_based: false

  reverse_hyperextension:
    display: "Reverse Hyperextension"
    log_names: ["Reverse Hyperextensions"]
    pattern: erector_extension
    bodyweight_type: true
    e1rm_applicable: false
    direct_erector: false          # hip extension bias, not spinal erector dose
    erector_family: true
    high_fatigue_spinal: true
    spinal_cost: 1
    substitutable_for_back_extension: false
    loadable: true
    time_based: false

  # ---- Other high-fatigue spinal work (weekly cap) ------------------------
  rdl:
    display: "Romanian Deadlift"
    log_names: ["Romanian Deadlift"]
    pattern: hinge
    e1rm_applicable: false         # short ROM vs a deadlift: e1RM is inflated, not a max
    high_fatigue_spinal: true
    spinal_cost: 2
    substitutable_for_back_extension: false   # constitution §2: never the erector dose
    erector_family: true
    direct_erector: false
    vbt_family: rdl
    loadable: true
    time_based: false

  good_morning:
    display: "Good Morning"
    log_names: ["Good Morning (seated)", "Good Morning (standing)", "Good Morning (from blocks)"]
    pattern: hinge
    e1rm_applicable: false         # technique/erector lift, never taken near a true max
    high_fatigue_spinal: true
    spinal_cost: 3        # long lever arm = high lumbar moment
    substitutable_for_back_extension: false
    erector_family: true
    direct_erector: false
    loadable: true
    time_based: false

  rack_pull:
    display: "Rack Pull"
    log_names: ["Rack Pull"]
    pattern: hinge
    e1rm_applicable: false         # pulled from pins: short ROM inflates any extrapolation
    high_fatigue_spinal: true
    spinal_cost: 3        # supramaximal loads are the point of the movement
    substitutable_for_back_extension: false
    erector_family: true
    direct_erector: false
    loadable: true
    time_based: false

  jefferson_curl:
    display: "Jefferson Curl"
    log_names: ["Jefferson Curl"]
    pattern: hinge
    high_fatigue_spinal: true
    spinal_cost: 2
    substitutable_for_back_extension: false
    direct_erector: true
    loadable: true
    time_based: false

  conventional_deadlift:
    display: "Conventional Deadlift"
    log_names: ["Deadlift (conventional)"]
    pattern: hinge
    high_fatigue_spinal: true
    spinal_cost: 3        # straighter bar path = longer lumbar moment than the trap bar
    substitutable_for_back_extension: false
    erector_family: true
    direct_erector: false
    vbt_family: conventional_deadlift
    loadable: true
    time_based: false

  # ---- Bodyweight / time-based (tonnage and reps-as-reps are invalid here) --
  ab_wheel:
    display: "Ab Wheel"
    log_names: ["Ab Wheel"]
    pattern: core_anti_extension
    bodyweight_type: true
    rep_semantics: reps
    loadable: true                # can be loaded, but usually bodyweight
    time_based: false

  pull_up:
    display: "Pull-up"
    log_names: ["Pull-ups (wide grip)", "Pull-ups (behind neck)", "Pull-ups (neutral grip)"]
    pattern: vertical_pull
    bodyweight_type: true
    rep_semantics: reps
    loadable: true                # added load is possible
    time_based: false

  lat_pulldown:
    display: "Lat Pulldown"
    # Substitutable for the pull-up in the vertical-pull slot (DEC-PULL-02): same prime movers,
    # but open-chain and loadable below bodyweight, so the loads are not comparable and
    # progression is tracked per variant. See docs/LONGEVITY-REVIEW.md.
    log_names: ["Lat Pulldown"]
    pattern: vertical_pull
    bodyweight_type: false
    rep_semantics: reps
    loadable: true
    time_based: false
    primary_muscles: [lats, biceps, upper_back]
    e1rm_applicable: false

  close_grip_pulldown:
    display: "Close Grip Pulldown"
    # A grip variant of the lat pulldown, not the same lift: the narrower grip changes
    # leverage and the load you can use, so it keeps its own history and selection slot.
    log_names: ["Close Grip Pulldown"]
    pattern: vertical_pull
    bodyweight_type: false
    rep_semantics: reps
    loadable: true
    time_based: false
    primary_muscles: [lats, biceps, upper_back]
    e1rm_applicable: false

  box_jump:
    display: "Box Jump"
    # Power work: maximal intent, full recovery, stop when height or quality drops. It is a
    # template slot, not a double-progression lift (DEC-POWER-01).
    log_names: ["Box Jumps", "Box Jump"]
    pattern: power_jump
    bodyweight_type: true
    rep_semantics: reps
    loadable: false
    time_based: false
    e1rm_applicable: false

  plank:
    display: "Plank"
    log_names: ["Regular Plank", "Chinese Plank", "Side Plank", "Front Plank"]
    pattern: core_isometric
    bodyweight_type: true
    rep_semantics: seconds        # <-- 80/90/110 in Reps_Done are SECONDS
    time_based: true
    loadable: true                # plate added on back is common

  carry:
    display: "Carry"
    log_names: ["Suitcase Carry", "Farmer's Carry", "Farmer Carry"]
    pattern: carry
    rep_semantics: seconds
    time_based: true
    loadable: true

  hanging_leg_raise:
    display: "Hanging Leg Raise"
    log_names: ["Hanging Leg Raise", "Hanging Pike"]
    pattern: core_flexion
    bodyweight_type: true
    rep_semantics: reps
    time_based: false

  # ---- Generic accessories that still need correct unit handling ----------
  lateral_raise:
    display: "Lateral Raise"
    log_names: ["Lateral Raise"]
    pattern: shoulder_isolation
    loadable: true
    time_based: false

  split_squat:
    display: "Split Squat"
    log_names: ["Split Squat", "Bulgarian Split Squat"]
    # Unilateral: one leg bears the load, so it is not a bilateral-squat variant.
    pattern: squat_unilateral
    primary_compound: true
    primary_muscles: [quadriceps, glutes]
    loadable: true
    time_based: false

