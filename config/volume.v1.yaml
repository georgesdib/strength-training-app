# Weekly hard-set ledger and conservative MRV cap (ROADMAP §4.17).
#
# MEV/MAV/MRV are coaching landmarks, not measured individual thresholds. The values are broad
# defaults informed by volume dose-response work and deliberately configurable; the cap only
# trims non-essential sets when a pattern is already over MRV. Under-MEV is reported, never
# auto-filled.
schema_version: "1.0.0"
window_weeks: 4
# Ledger coverage: unknown = divide by observed weeks; complete = a week with no working
# sets is a real zero. Complete is an explicit athlete choice, never inferred from a blank frame.
ledger:
  coverage: unknown    # unknown | complete
  set_accounting: hard # hard | effective (direct 1, configured indirect 0.5)
apply_mrv_cap: true

under_mev:
  # Add one accessory set when a pattern has been below MEV for three weeks. This is a
  # deterministic programme adjustment, not an experiment; main lifts are never increased here.
  enabled: true
  weeks: 3
  add_sets: 1
  max_sets_per_item: 8

landmarks:
  # pattern: {mev, mav: [low, high], mrv}
  squat: {mev: 6, mav: [8, 12], mrv: 14}
  hinge: {mev: 6, mav: [6, 9], mrv: 10}
  hinge_unilateral: {mev: 0, mav: [0, 6], mrv: 8}
  horizontal_push: {mev: 8, mav: [10, 16], mrv: 18}
  vertical_push: {mev: 3, mav: [4, 8], mrv: 10}
  horizontal_pull: {mev: 4, mav: [6, 10], mrv: 12}
  vertical_pull: {mev: 3, mav: [4, 8], mrv: 10}
  core: {mev: 3, mav: [4, 9], mrv: 12}

budget:
  # Weekly volume budget (docs/VOLUME-MODULATION-PLAN.md, DEC-VOLUME-06). The target is
  # the six-session cycle average; tests/test_volume_budget.py pins these numbers to the
  # templates, so a template change fails loudly instead of silently moving the dose.
  # enabled is the fallback used only when no athlete profile flag is recorded; the profile
  # flag athlete_profile.volume_budget_enabled (default off) is authoritative.
  enabled: false
  # Explicit total. It must equal the sum of weekly_target below; the check catches editing only
  # one of the two numbers. Change both when changing the weekly dose.
  weekly_total: 57
  # Effective-set target used only when ledger.set_accounting=effective. Direct 1.0,
  # indirect 0.25; this preserves the current direct dose and is NOT applied while accounting
  # remains hard. The total must equal the sum of weekly_target_effective.
  weekly_total_effective: 68.25
  weekly_target_effective:
    squat: 10
    hinge: 6.5
    hinge_unilateral: 0
    horizontal_push: 12.75
    horizontal_pull: 10.125
    vertical_push: 6
    vertical_pull: 6.75
    core: 10.125
    erector_extension: 3
    power_jump: 3
  # Opt-in reduce mode: keep at least this many sets of a filled group's main lift. A coaching
  # assumption, configurable; preserve never trims a main lift (ASSUMPTION-49).
  main_lift_floor: 3
  # Every allocation knob is config-backed; there is no hidden constant in the engine.
  trim_enabled: true
  top_up_enabled: true
  weekly_target:
    squat: 10
    hinge: 6.5
    hinge_unilateral: 0
    horizontal_push: 12
    horizontal_pull: 9
    vertical_push: 3
    vertical_pull: 4.5
    core: 6
    # Fixed template doses: they count toward the weekly total and the session cap, but the
    # budget never trims or tops them up.
    erector_extension: 3
    power_jump: 3
  session_cap:
    # The daily/session total and per-group caps, not a measured maximum (ASSUMPTION-41). The
    # time estimate below remains the practical limit.
    total: 30
    per_pattern:
      squat: 8
      hinge: 6
      hinge_unilateral: 5
      horizontal_push: 8
      horizontal_pull: 8
      vertical_push: 5
      vertical_pull: 5
      core: 6
  # Do not chase an exact weekly number: the normal six-session phases are 56 and 58 against 57.
  tolerance: 0.10
  # A per-group band is at least this many sets, even when tolerance is smaller.
  band_min: 1
  # Trim floor for an accessory (never below one working set) and the per-item top-up ceiling.
  min_accessory_sets: 1
  top_up_max_sets_per_item: 8
  # Time estimate: execution seconds per set plus the item's rest, plus the warm-up allowance.
  set_seconds: 30
  # Warm-ups are attached after deload, so the budget uses a planning allowance instead of the
  # final warm-up list (step 0 implementation decision).
  warmup_estimate_minutes: 5
  session_time_cap_minutes: 80
  # Step 9a: read-only cross-group compensation simulation. enabled controls the preview;
  # apply is reserved for 9b and must stay false (no prescription change yet).
  # Step 9b: apply the selected slot when the budget is on. The candidate needs an executable
  # load; otherwise the engine refuses it and changes nothing.
  compensation:
    enabled: true
    apply: true
    floor: 0.1
    similarity:
      squat: {hinge: 0.7, horizontal_push: 0.2}
      hinge: {squat: 0.7, horizontal_push: 0.2}
      horizontal_push: {squat: 0.2, hinge: 0.2, horizontal_pull: 0.3}
      horizontal_pull: {horizontal_push: 0.3}
    slots:
      squat:
        - exercise_id: dumbbell_bench_press
          group: horizontal_push
          sets: 3
          reps_low: 8
          reps_high: 12
          rir_low: 2
          rir_high: 3
          rest_s: 90
          load_source: double_progression
        - exercise_id: rdl
          group: hinge
          sets: 3
          reps_low: 8
          reps_high: 12
          rir_low: 2
          rir_high: 3
          rest_s: 120
          load_source: double_progression
      bench_squat:
        - exercise_id: rdl
          group: hinge
          sets: 3
          reps_low: 8
          reps_high: 12
          rir_low: 2
          rir_high: 3
          rest_s: 120
          load_source: double_progression
        - exercise_id: dumbbell_bench_press
          group: horizontal_push
          sets: 3
          reps_low: 8
          reps_high: 12
          rir_low: 2
          rir_high: 3
          rest_s: 90
          load_source: double_progression
      hinge:
        - exercise_id: dumbbell_bench_press
          group: horizontal_push
          sets: 3
          reps_low: 8
          reps_high: 12
          rir_low: 2
          rir_high: 3
          rest_s: 90
          load_source: double_progression
      bench_hinge:
        - exercise_id: dumbbell_bench_press
          group: horizontal_push
          sets: 3
          reps_low: 8
          reps_high: 12
          rir_low: 2
          rir_high: 3
          rest_s: 90
          load_source: double_progression
        - exercise_id: rdl
          group: hinge
          sets: 3
          reps_low: 8
          reps_high: 12
          rir_low: 2
          rir_high: 3
          rest_s: 120
          load_source: double_progression
  # 9c-1: drop engine. At/above the high band -> technique; otherwise a volume_fill session.
  drop:
    enabled: true
    competition_confirm_days: 7
    max_slots_per_group: 1
    technique_minutes: 30
    slots:
      horizontal_push:
        - {exercise_id: dumbbell_bench_press, sets: 3}
        - {exercise_id: incline_db_bench_press, sets: 3}
      hinge:
        - {exercise_id: rdl, sets: 3}
      horizontal_pull:
        - {exercise_id: dumbbell_chest_supported_row, sets: 3}
        - {exercise_id: dumbbell_row, sets: 3}
      vertical_pull:
        - {exercise_id: pull_up, sets: 3, load_source: bodyweight}
        - {exercise_id: lat_pulldown, sets: 3}
      vertical_push:
        - {exercise_id: landmine_press, sets: 3}
      core:
        - {exercise_id: ab_wheel, sets: 3, load_source: bodyweight}
        - {exercise_id: hanging_leg_raise, sets: 3, load_source: bodyweight}
      hinge_unilateral:
        - {exercise_id: single_leg_db_rdl, sets: 3}
