# Weekly hard-set ledger and conservative MRV cap (ROADMAP §4.17).
#
# MEV/MAV/MRV are coaching landmarks, not measured individual thresholds. The values are broad
# defaults informed by volume dose-response work and deliberately configurable; the cap only
# trims non-essential sets when a pattern is already over MRV. Under-MEV is reported, never
# auto-filled.
schema_version: "1.0.0"
window_weeks: 4
apply_mrv_cap: true

under_mev:
  # Add one accessory set when a pattern has been below MEV for three weeks. This is a
  # deterministic programme adjustment, not an experiment; main lifts are never increased here.
  enabled: true
  weeks: 3
  add_sets: 1
  max_sets_per_item: 8

landmarks:
  # pattern: {mev, mav: [low, high], mrv}
  squat: {mev: 6, mav: [8, 12], mrv: 14}
  hinge: {mev: 6, mav: [6, 9], mrv: 10}
  hinge_unilateral: {mev: 0, mav: [0, 6], mrv: 8}
  horizontal_push: {mev: 8, mav: [10, 16], mrv: 18}
  vertical_push: {mev: 3, mav: [4, 8], mrv: 10}
  horizontal_pull: {mev: 4, mav: [6, 10], mrv: 12}
  vertical_pull: {mev: 3, mav: [4, 8], mrv: 10}
  core: {mev: 3, mav: [4, 9], mrv: 12}

budget:
  # Read-only weekly volume budget (docs/VOLUME-MODULATION-PLAN.md, DEC-VOLUME-06). The target is
  # the six-session cycle average; tests/test_volume_budget.py pins these numbers to the
  # templates, so a template change fails loudly instead of silently moving the dose.
  # enabled is the fallback used only when no athlete profile flag is recorded; the profile
  # flag athlete_profile.volume_budget_enabled (default off) is authoritative.
  enabled: false
  # Explicit total. It must equal the sum of weekly_target below; the check catches editing only
  # one of the two numbers. Change both when changing the weekly dose.
  weekly_total: 57
  weekly_target:
    squat: 10
    hinge: 6.5
    hinge_unilateral: 0
    horizontal_push: 12
    horizontal_pull: 9
    vertical_push: 3
    vertical_pull: 4.5
    core: 6
    # Fixed template doses: they count toward the weekly total and the session cap, but the
    # budget never trims or tops them up.
    erector_extension: 3
    power_jump: 3
  session_cap:
    # A per-session fatigue guard, not a measured maximum (ASSUMPTION-41). The time estimate
    # below remains the practical limit.
    total: 30
    per_pattern:
      squat: 8
      hinge: 6
      hinge_unilateral: 5
      horizontal_push: 8
      horizontal_pull: 8
      vertical_push: 5
      vertical_pull: 5
      core: 6
  # Do not chase an exact weekly number: the normal six-session phases are 56 and 58 against 57.
  tolerance: 0.10
  # Warm-ups are attached after deload, so the budget uses a planning allowance instead of the
  # final warm-up list (step 0 implementation decision).
  warmup_estimate_minutes: 5
  session_time_cap_minutes: 80
