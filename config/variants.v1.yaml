    - lat_pulldown
    - close_grip_pulldown
    erector: &id003
    - back_extension
    - hyperextension
    - reverse_hyperextension
    accessory_vertical_press: &id004
    - overhead_press_seated
    - landmine_press
    - dumbbell_press_alternating
    - overhead_press_behind_the_neck
    accessory_split_squat: &id005
    - split_squat
    - side_lunges
    core_anti_extension: &id006
    - ab_wheel
    core_flexion: &id007
