# Additional selection candidates per slot (explicit apply; the template decides the default).
#
# New session types use the same candidate lists as the legacy A/B/C shapes. The catalogue
# only feeds the selector; applying a substitution is an explicit UI/CLI opt-in.
slots:
  A:
    squat_main: &id008
    - ssb_squat
    - competition_squat
    - front_squat
    - front_squat_to_box
    - high_bar_squat
