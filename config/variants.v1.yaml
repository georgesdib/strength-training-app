# Additional selection candidates per slot (shadow only; does not change the prescription).
#
# All canonical variants now rewrite their historical clean_set identity via migration 0014.
# This catalogue is selection-only: the prescription engine still uses the template's
# exercise/exercise_variants. Trap bar date-scoping and back-extension equivalence are
# preserved by the migration.
