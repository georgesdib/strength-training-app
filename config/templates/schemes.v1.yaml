# Rep schemes. The prescription picks one per exercise; Python solves the load for it.
#
# The lowest scheme exists because strength is load-specific: 1-3 reps at a controlled RIR is a
# legitimate maximal-strength exposure in trained lifters. DEC-RESOLVER-04 explicitly allows the
# prescribed hinge main lifts on this scheme; the accessory/risk hinges remain excluded below.
# The engine warns on every maximal hinge because the ordinal spinal cap is load-blind.
schema_version: "1.0.0"

# The exclusion list below still protects the accessory/risk hinges. This flag disables the
# maximal exclusion for the prescribed hinge main lifts only; it is profile-backed.
maximal_hinge_allowed: true

schemes:
  maximal:
    label: "maximal strength (1-3 reps)"
    reps: [1, 3]
    # Only lifts with safeties. The three prescribed hinge main lifts are allowed by the
    # override above; accessory/risk hinges remain excluded.
    exclude: [trap_bar_deadlift, sumo_deadlift, rdl, good_morning, rack_pull,
              conventional_deadlift, jefferson_curl]

  strength:
    label: "strength (3-5 reps)"
    reps: [3, 5]

  volume:
    label: "volume (6-8 reps)"
    reps: [6, 8]

  accessory:
    label: "accessory (8-12 reps)"
    reps: [8, 12]
