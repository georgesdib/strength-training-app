# Session types for the rolling two-week emphasis cycle.
#
# Session types are the canonical identity; there is no legacy day override.
#
# Back-extension rule: only the squat-emphasis session carries direct erector work. The hinge
# session and the bench+hinge session must not; the bench+squat session also omits it so a
# normal week stays at or below the spinal cap (squat 1 + hinge 2 = 3).
schema_version: "1.0.0"

session_types:
  squat:
    label: "Squat emphasis"
    prescription:
      time_cap_s: 4800
      slots:
        - id: power
          exercise: box_jump
          sets: 3
          reps: {low: 3, high: 5}
          rir: {low: 4, high: 5}
          rest_s: 120
          essential: false
          power: true
          # Quality/height, never an external load; no e1RM or double progression.
          load_source: bodyweight
        - id: squat_main
          exercise: ssb_squat
          sets: 5
          reps: {low: 3, high: 5}
          rir: {low: 2, high: 3}
          rest_s: 180
          essential: true
          load_source: e1rm
        - id: bench_support
          exercise: bench_press
          sets: 4
          reps: {low: 3, high: 5}
          rir: {low: 2, high: 3}
          rest_s: 180
          essential: true
          load_source: e1rm
        - id: erector
          exercise: back_extension
          sets: 3
          reps: {low: 10, high: 12}
          rir: {low: 2, high: 3}
          rest_s: 90
          essential: false
          load_source: double_progression
        - id: accessory_row
          exercise: dumbbell_row
          sets: 3
          reps: {low: 8, high: 12}
          rir: {low: 2, high: 3}
          rest_s: 90
          essential: false
          load_source: double_progression
        - id: core_anti_extension
          exercise: ab_wheel
          sets: 3
          reps: {low: 6, high: 10}
          rir: {low: 2, high: 3}
          rest_s: 90
          essential: false
          load_source: double_progression

  hinge:
    label: "Hinge emphasis"
    prescription:
      time_cap_s: 4800
      slots:
        - id: hinge_main
          exercise: trap_bar_deadlift
          sets: 5
          reps: {low: 3, high: 5}
          rir: {low: 2, high: 3}
          rest_s: 180
          essential: true
          load_source: e1rm
        - id: bench_main
          exercise_variants: [bench_press_narrow, bench_press_pause]
          sets: 4
          reps: {low: 3, high: 5}
          rir: {low: 2, high: 3}
          rest_s: 180
          essential: true
          load_source: e1rm
        - id: accessory_pull_up
          exercise_variants: [pull_up, lat_pulldown]
          sets: 3
          reps: {low: 6, high: 10}
          rir: {low: 2, high: 3}
          rest_s: 90
          essential: false
          load_source: double_progression
        - id: accessory_row
          exercise: dumbbell_row
          sets: 3
          reps: {low: 8, high: 12}
          rir: {low: 2, high: 3}
          rest_s: 90
          essential: false
          load_source: double_progression
        - id: accessory_split_squat
          exercise: split_squat
          sets: 3
          reps: {low: 8, high: 10}
          rir: {low: 2, high: 3}
          rest_s: 90
          essential: false
          load_source: double_progression

  bench_squat:
    label: "Bench + squat support"
    prescription:
      time_cap_s: 4800
      slots:
        - id: bench_main
          exercise: bench_press
          sets: 4
          reps: {low: 3, high: 5}
          rir: {low: 2, high: 3}
          rest_s: 180
          essential: true
          load_source: e1rm
        - id: squat_support
          exercise: ssb_squat
          sets: 4
          reps: {low: 3, high: 5}
          rir: {low: 2, high: 3}
          rest_s: 180
          essential: true
          load_source: e1rm
        - id: accessory_row
          exercise: dumbbell_row
          sets: 3
          reps: {low: 8, high: 12}
          rir: {low: 2, high: 3}
          rest_s: 90
          essential: false
          load_source: double_progression
        - id: accessory_vertical_press
          exercise: overhead_press_seated
          sets: 3
          reps: {low: 6, high: 10}
          rir: {low: 2, high: 3}
          rest_s: 90
          essential: false
          load_source: double_progression
        - id: core_anti_extension
          exercise: ab_wheel
          sets: 3
          reps: {low: 6, high: 10}
          rir: {low: 2, high: 3}
          rest_s: 90
          essential: false
          load_source: double_progression

  bench_hinge:
    label: "Bench + hinge support"
    prescription:
      time_cap_s: 4800
      slots:
        - id: bench_main
          exercise: bench_press
          sets: 4
          reps: {low: 3, high: 5}
          rir: {low: 2, high: 3}
          rest_s: 180
          essential: true
          load_source: e1rm
        - id: hinge_support
          exercise: single_leg_db_rdl
          sets: 3
          reps: {low: 8, high: 10}
          rir: {low: 2, high: 3}
          rest_s: 90
          essential: false
          load_source: double_progression
        - id: accessory_pull_up
          exercise_variants: [pull_up, lat_pulldown]
          sets: 3
          reps: {low: 6, high: 10}
          rir: {low: 2, high: 3}
          rest_s: 90
          essential: false
          load_source: double_progression
        - id: accessory_row
          exercise: dumbbell_row
          sets: 3
          reps: {low: 8, high: 12}
          rir: {low: 2, high: 3}
          rest_s: 90
          essential: false
          load_source: double_progression
        - id: accessory_vertical_press
          exercise: overhead_press_seated
          sets: 3
          reps: {low: 6, high: 10}
          rir: {low: 2, high: 3}
          rest_s: 90
          essential: false
          load_source: double_progression
        - id: core_flexion
          exercise: hanging_leg_raise
          sets: 3
          reps: {low: 8, high: 12}
          rir: {low: 2, high: 3}
          rest_s: 90
          essential: false
          load_source: double_progression
