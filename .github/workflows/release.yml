name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged source
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Install project without resolving unpinned dependencies
        run: python -m pip install --no-deps -e .

      - name: Verify tag matches project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          tag = os.environ["TAG"]
          version = tomllib.loads(
              open("pyproject.toml", "rb").read().decode("utf-8")
          )["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(
                  f"tag {tag!r} does not match pyproject version v{version}; "
                  "bump the version or retag the release"
              )
          print(f"tag and version agree: {tag}")
          PY

      - name: Build release artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="strength-coach-${TAG}/" \
            -o "dist/strength-coach-${TAG}.tar.gz" HEAD
          python -m pip wheel . --no-deps --wheel-dir dist
          python tools/smoke_release.py "dist/strength-coach-${TAG}.tar.gz"
          test -s "dist/strength-coach-${TAG}.tar.gz"
          test -s dist/*.whl
          sha256sum dist/* > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::release ${TAG} already exists; refusing to replace its assets"
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE=""
          case "${TAG}" in
            *a*|*b*|*rc*) PRERELEASE="--prerelease --latest=false" ;;
          esac
          gh release create "${TAG}" dist/* \
            --verify-tag \
            --title "${TAG}" \
            --notes "Source archive, wheel and checksums for ${TAG}. See CHANGELOG.md and docs/RELEASING.md." \
            ${PRERELEASE}
